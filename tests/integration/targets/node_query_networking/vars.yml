---
# Taxonomy values must be lowercase_with_underscores (^[a-z0-9]+(_[a-z0-9]+)*$)
# or the indirect-node rollup cannot bucket them; "PublicCloud" and
# "public_cloud" become two separate buckets downstream.
networking_common_facts:
  infra_type: "public_cloud"
  infra_bucket: "networking"
networking_facts:
  vpc: "vpc"
  subnet: "subnet"
  nat_gateway: "nat_gateway"
  igw: "internet_gateway"
  vgw: "virtual_gateway"
  route_table: "route_table"
  vpn: "vpn_connection"
  peering: "vpc_peering"

vpcs_info:
  - name: "{{ resource_prefix }}-1"
    cidr: "10.{{ 256 | random(seed=resource_prefix) }}.0.0/16"
    tags:
      resource_prefix: "{{ resource_prefix }}"
  - name: "{{ resource_prefix }}-2"
    cidr: "10.{{ 256 | random(seed=resource_prefix ~ '-2') }}.0.0/16"
  - name: "{{ resource_prefix }}-3"
    cidr: "10.{{ 256 | random(seed=resource_prefix ~ '-3') }}.0.0/16"
subnets_info:
  - cidr: "10.{{ 256 | random(seed=resource_prefix) }}.1.0/24"
    tags:
      resource_prefix: "{{ resource_prefix }}"
  - cidr: "10.{{ 256 | random(seed=resource_prefix) }}.2.0/24"
  