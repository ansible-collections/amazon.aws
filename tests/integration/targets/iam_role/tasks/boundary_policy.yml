---
# Test boundary policy configuration on IAM roles
# Note: Boundary policies can now be used without restrictions
# (previously required create_instance_profile: false)

- name: Create minimal role with no boundary policy
  amazon.aws.iam_role:
    name: "{{ test_role }}"
  register: create_role_result

- name: Verify role was created without boundary
  ansible.builtin.assert:
    that:
      - create_role_result is changed
      - create_role_result.iam_role.role_name == test_role
    fail_msg: "Role creation should succeed without boundary policy"

- name: Configure Boundary Policy (check mode)
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    boundary: "{{ boundary_policy }}"
  check_mode: true
  register: boundary_check_mode

- name: Verify boundary configuration is detected in check mode
  ansible.builtin.assert:
    that:
      - boundary_check_mode is changed
    fail_msg: "Check mode should detect boundary policy change"

- name: Configure Boundary Policy
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    boundary: "{{ boundary_policy }}"
  register: boundary_result

- name: Verify boundary policy was configured
  ansible.builtin.assert:
    that:
      - boundary_result is changed
      - boundary_result.iam_role.role_name == test_role
    fail_msg: "Boundary policy configuration should report changed"

- name: Configure Boundary Policy (idempotency - check mode)
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    boundary: "{{ boundary_policy }}"
  check_mode: true
  register: boundary_idempotent_check

- name: Verify idempotency in check mode
  ansible.builtin.assert:
    that:
      - boundary_idempotent_check is not changed
    fail_msg: "Reconfiguring same boundary should not report changed in check mode"

- name: Configure Boundary Policy (idempotency)
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    boundary: "{{ boundary_policy }}"
  register: boundary_idempotent

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - boundary_idempotent is not changed
      - boundary_idempotent.iam_role.role_name == test_role
    fail_msg: "Reconfiguring same boundary should not report changed"

- name: Get role info after adding boundary policy
  amazon.aws.iam_role_info:
    name: "{{ test_role }}"
  register: role_info

- name: Verify role has correct boundary policy configuration
  ansible.builtin.assert:
    that:
      - role_info is succeeded
      - role_info.iam_roles | length == 1
      - role_info.iam_roles[0].arn.startswith("arn")
      - role_info.iam_roles[0].arn.endswith("role/" + test_role)
      - '"assume_role_policy_document" in role_info.iam_roles[0]'
      - '"create_date" in role_info.iam_roles[0]'
      - '"description" not in role_info.iam_roles[0]'
      - role_info.iam_roles[0].inline_policies | length == 0
      - role_info.iam_roles[0].instance_profiles | length == 0
      - role_info.iam_roles[0].managed_policies | length == 0
      - role_info.iam_roles[0].max_session_duration == 3600
      - role_info.iam_roles[0].path == '/'
      - role_info.iam_roles[0].permissions_boundary.permissions_boundary_arn == boundary_policy
      - role_info.iam_roles[0].permissions_boundary.permissions_boundary_type == 'Policy'
      - role_info.iam_roles[0].role_id == boundary_result.iam_role.role_id
      - role_info.iam_roles[0].role_name == test_role
    fail_msg: "Role should have correct boundary policy and attributes"

- name: Remove IAM Role
  amazon.aws.iam_role:
    state: absent
    name: "{{ test_role }}"
  register: delete_role_result

- name: Verify role was deleted
  ansible.builtin.assert:
    that:
      - delete_role_result is changed
    fail_msg: "Role deletion should report changed"
