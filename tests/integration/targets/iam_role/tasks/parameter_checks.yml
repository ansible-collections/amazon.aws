---
# Parameter validation tests for IAM role module
# Tests error handling for invalid parameter values

- name: Test boundary policy validation - must be an ARN
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    boundary: AWSDenyAll
  register: boundary_not_arn
  ignore_errors: true

- name: Verify boundary policy ARN validation
  ansible.builtin.assert:
    that:
      - boundary_not_arn is failed
      - '"Boundary policy" in boundary_not_arn.msg'
      - '"ARN" in boundary_not_arn.msg'
    fail_msg: "Boundary policy validation should require ARN format"

- name: Test assume_role_policy_document is required when state=present
  module_defaults:
    amazon.aws.iam_role: {}
  amazon.aws.iam_role:
    name: "{{ test_role }}"
  register: missing_assume_policy
  ignore_errors: true

- name: Verify assume_role_policy_document requirement
  ansible.builtin.assert:
    that:
      - missing_assume_policy is failed
      - missing_assume_policy.msg.startswith("state is present but all of the following are missing")
      - '"assume_role_policy_document" in missing_assume_policy.msg'
    fail_msg: "assume_role_policy_document should be required for state=present"

- name: Test max_session_duration minimum boundary (too low)
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    max_session_duration: 3599
  register: duration_too_low
  ignore_errors: true

- name: Verify minimum session duration validation
  ansible.builtin.assert:
    that:
      - duration_too_low is failed
      - '"max_session_duration must be between" in duration_too_low.msg'
    fail_msg: "max_session_duration below 3600 should be rejected"

- name: Test max_session_duration maximum boundary (too high)
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    max_session_duration: 43201
  register: duration_too_high
  ignore_errors: true

- name: Verify maximum session duration validation
  ansible.builtin.assert:
    that:
      - duration_too_high is failed
      - '"max_session_duration must be between" in duration_too_high.msg'
    fail_msg: "max_session_duration above 43200 should be rejected"

- name: Test role path validation - must start with /
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    path: test/
  register: path_no_leading_slash
  ignore_errors: true

- name: Verify path must start with /
  ansible.builtin.assert:
    that:
      - path_no_leading_slash is failed
      - '"path must begin and end with /" in path_no_leading_slash.msg'
    fail_msg: "Path without leading slash should be rejected"

- name: Test role path validation - must end with /
  amazon.aws.iam_role:
    name: "{{ test_role }}"
    path: /test
  register: path_no_trailing_slash
  ignore_errors: true

- name: Verify path must end with /
  ansible.builtin.assert:
    that:
      - path_no_trailing_slash is failed
      - '"path must begin and end with /" in path_no_trailing_slash.msg'
    fail_msg: "Path without trailing slash should be rejected"
