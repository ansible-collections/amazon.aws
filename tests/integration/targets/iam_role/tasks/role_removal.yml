---
- name: Remove IAM Role (check mode)
  amazon.aws.iam_role:
    state: absent
    name: "{{ test_role }}"
  check_mode: true
  register: iam_role

- name: Verify role removal is detected in check mode
  ansible.builtin.assert:
    that:
      - iam_role is changed

- name: Get role info after check mode deletion
  amazon.aws.iam_role_info:
    name: "{{ test_role }}"
  register: role_info

- name: Verify role still exists after check mode
  ansible.builtin.assert:
    that:
      - role_info is succeeded
      - role_info.iam_roles | length == 1

- name: Remove IAM Role
  amazon.aws.iam_role:
    state: absent
    name: "{{ test_role }}"
  register: iam_role

- name: Verify role was removed
  ansible.builtin.assert:
    that:
      - iam_role is changed

- name: Get role info after deletion
  amazon.aws.iam_role_info:
    name: "{{ test_role }}"
  register: role_info

- name: Verify role no longer exists
  ansible.builtin.assert:
    that:
      - role_info is succeeded
      - role_info.iam_roles | length == 0

- name: Remove IAM Role (idempotency - check mode)
  amazon.aws.iam_role:
    state: absent
    name: "{{ test_role }}"
  check_mode: true
  register: iam_role

- name: Verify role removal idempotency in check mode
  ansible.builtin.assert:
    that:
      - iam_role is not changed

- name: Remove IAM Role (idempotency)
  amazon.aws.iam_role:
    state: absent
    name: "{{ test_role }}"
  register: iam_role

- name: Verify role removal idempotency
  ansible.builtin.assert:
    that:
      - iam_role is not changed
