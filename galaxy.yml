---
namespace: amazon
name: aws
version: 12.0.0-dev0
readme: README.md
authors:
  - Ansible (https://github.com/ansible)
description: A variety of Ansible content to help automate the management of AWS services.
license_file: COPYING
tags: [amazon, aws, cloud]
repository: https://github.com/ansible-collections/amazon.aws
documentation: https://ansible-collections.github.io/amazon.aws/branch/main/collections/amazon/aws/index.html
homepage: https://github.com/ansible-collections/amazon.aws
issues: https://github.com/ansible-collections/amazon.aws/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc
build_ignore:
  - "*cloud-config-aws.ini"
  - "*cloud-config-aws.yml"
  - changelogs/.plugin-cache.yaml
  # Local developer environment artifacts, never part of the published artifact.
  # "collections" and ".tox" are listed here because "ade install --editable"
  # appends them itself; pre-declaring them keeps galaxy.yml unmodified after a
  # contributor runs the documented setup sequence.
  - .venv
  - .ansible.cfg
  - collections
  - .tox
