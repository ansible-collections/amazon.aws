---
ci:
  autofix_commit_msg: "update collection variables"
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly

repos:
  # Replaces .github/workflows/update-variables.yml, which called the
  # update_aws_variables.yml reusable workflow and pushed commits back to the
  # pull request with a write-scoped token. That approach cannot work for pull
  # requests from forks: GITHUB_TOKEN is scoped to the base repository, so the
  # push to the contributor's fork is rejected. pre-commit.ci is a GitHub App
  # rather than an Actions workflow, so it is not bound by that scoping and can
  # autofix fork pull requests.
  #
  # NOTE: `rev` must point at a commit of ansible-network/github_actions that
  # contains .pre-commit-hooks.yaml. That file does not exist upstream yet --
  # it is added by the companion pull request. Once that merges, set the SHA:
  #
  #   git ls-remote https://github.com/ansible-network/github_actions main
  #
  # Until then you can point `rev` at a commit on the fork carrying the branch.
  - repo: https://github.com/ansible-network/github_actions
    rev: 38b45197e14346c2e1b9d4bca048d0ff8c29a9b2 # main as of 2026-11-23
    hooks:
      # Was the `user-agent` job: keeps AMAZON_AI_COLLECTION_VERSION in
      # plugins/module_utils/common.py in sync with galaxy.yml.
      - id: update-aws-user-agent
      # Was the `boto-constraints` job: keeps tests/unit/constraints.txt in
      # sync with the boto3/botocore pins in requirements.txt.
      - id: update-aws-boto-constraints
