---
# Managed with prek (https://github.com/j178/prek), a drop-in replacement for
# pre-commit. See CONTRIBUTING.md for setup and usage.
#
# Hook set: basic hygiene + ruff (check/format) + ansible-lint + AWS variable sync.

ci:
  autofix_commit_msg: "update collection variables"
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  # The ruff hook is `language: system` and shells out to tox, so pre-commit
  # installs nothing for it and tox has to already be on PATH. That holds for a
  # local checkout but not for pre-commit.ci's environment.
  skip:
    - ruff

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &excluded_paths |
          (?x)^(
            tests/unit/plugins/modules/placebo_recordings/.*|
            tests/unit/plugins/modules/fixtures/.*|
            tests/integration/.*|
            tests/sanity/ignore-.*\.txt|
            \.github/workflows/(integration|integration_check)\.yml
          )$
      - id: end-of-file-fixer
        exclude: *excluded_paths
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: *excluded_paths
      - id: mixed-line-ending
        exclude: *excluded_paths
        args:
          - --fix=lf
      - id: no-commit-to-branch
        args:
          - -b main

  # Local hook delegates to tox for single-source-of-truth ruff version
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: tox -e ruff --
        language: system
        types: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        args: [--offline]

  # Replaces .github/workflows/update-variables.yml, which called the
  # update_aws_variables.yml reusable workflow and pushed commits back to the
  # pull request with a write-scoped token. That approach cannot work for pull
  # requests from forks: GITHUB_TOKEN is scoped to the base repository, so the
  # push to the contributor's fork is rejected.
  - repo: https://github.com/ansible-network/github_actions
    rev: 38b45197e14346c2e1b9d4bca048d0ff8c29a9b2 # main as of 2026-11-23
    hooks:
      # Was the `user-agent` job: keeps AMAZON_AWS_COLLECTION_VERSION in
      # plugins/module_utils/common.py in sync with the version in galaxy.yml.
      - id: update-aws-user-agent
      #
      # The `boto-constraints` job is deliberately NOT enabled here.
      # update_aws_boto_constraints.py reads the boto3/botocore floors from
      # requirements.txt, but in this collection that file only contains
      # "-r meta/ee-requirements.txt" and the script does not follow the
      # include. Its regexes match nothing, both versions resolve to the empty
      # string, and it rewrites them as empty:
      #   plugins/module_utils/botocore.py   MINIMUM_BOTOCORE_VERSION = ""
      #   tests/integration/constraints.txt  botocore==
      # Enabling it needs an upstream fix first: read meta/ee-requirements.txt,
      # or fail loudly when no version is found.
