---
# Managed with prek (https://github.com/j178/prek), a drop-in replacement for
# pre-commit. See CONTRIBUTING.md for setup and usage.
#
# Hook set: basic hygiene + ruff (check/format) + ansible-lint.
# ruff rev must match [tool.ruff] required-version and tox ruff deps (0.16.9).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &excluded_paths |
          (?x)^(
            tests/unit/plugins/modules/placebo_recordings/.*|
            tests/unit/plugins/modules/fixtures/.*|
            tests/integration/.*|
            tests/sanity/ignore-.*\.txt|
            \.github/workflows/(integration|integration_check)\.yml
          )$
      - id: end-of-file-fixer
        exclude: *excluded_paths
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: *excluded_paths
      - id: mixed-line-ending
        exclude: *excluded_paths
        args:
          - --fix=lf
      - id: no-commit-to-branch
        args:
          - -b main

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.24
    hooks:
      - id: uv-lock

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
