# Lint/format/complexity and helper envs live here.
# Unit and sanity matrices are generated by tox-ansible (see [tool.tox-ansible] in pyproject.toml).
# Run generated envs with: tox list --ansible / tox -e unit-py3.14-2.20 --ansible

[tox]
# tox.ini is the active config source (it takes precedence over pyproject.toml),
# so the tox-ansible pin must live here — a `requires` in pyproject's [tool.tox]
# is ignored while this file exists. This lets CI install only `tox` and have
# tox-ansible auto-provisioned for `--ansible` runs.
requires =
    tox>=4.52.1
    tox-ansible==26.9.0
skipsdist = True
skip_missing_interpreters = True
envlist =
    ruff-lint
    pylint-lint

[common]
collection_name = amazon.aws
collection_path = amazon/aws

format_dirs = {toxinidir}/plugins {toxinidir}/tests {toxinidir}/extensions
lint_dirs = {toxinidir}/plugins {toxinidir}/tests {toxinidir}/extensions

community_aws_install = sh -c 'VERSION=$(grep "^version:" {toxinidir}/galaxy.yml | cut -d" " -f2); \
       if echo "$VERSION" | grep -q -- "-dev"; then BRANCH="main"; \
       else MAJOR=$(echo "$VERSION" | cut -d. -f1); BRANCH="stable-$MAJOR"; fi; \
       ansible-galaxy collection install "git+https://github.com/ansible-collections/community.aws.git,$BRANCH" 2>/dev/null || \
       ansible-galaxy collection install git+https://github.com/ansible-collections/community.aws.git'

ansible_home = {envtmpdir}/ansible_home
ansible_collections_path = {[common]ansible_home}/collections
full_collection_path = {[common]ansible_home}/collections/ansible_collections/{[common]collection_path}

# Oldest collection-supported pair (ansible-core 2.18 / Python 3.11) with pinned
# boto3/botocore. Replaces the former with_constraints matrix axis.
[testenv:unit-constraints]
description = Unit tests on oldest supported ansible-core/Python with SDK constraints
basepython = python3.11
labels =
    unit
    unit-constraints
set_env =
  ANSIBLE_HOME={[common]ansible_home}
  ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
deps =
  pytest
  mock
  pytest-mock
  pytest-cov
  pytest-ansible
  pytest-xdist
  -ctests/constraints.in
  -rmeta/ee-requirements.txt
  -rtests/unit/requirements.in
  ansible-core>2.18,<2.19
allowlist_externals = rsync, sh
change_dir = {[common]full_collection_path}
commands_pre =
  rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
  {[common]community_aws_install}
commands =
    pytest \
        --cov \
        --cov-report html \
        --cov-report xml \
        --ansible-host-pattern localhost \
        {posargs:tests/unit/}

# SonarCloud / diff-cover coverage artifact.
# tox-ansible's generated unit coverage is scoped to plugins/ only; this env uses the
# pyproject [tool.coverage.run] source (plugins/ AND extensions/) so coverage of the
# EDA event_source plugins under extensions/ is not lost. Mirrors the retired
# ansible2.20-py314-with_constraints env the coverage job used previously.
[testenv:coverage]
description = Unit tests with full plugins/ + extensions/ coverage for SonarCloud
basepython = python3.14
labels =
    coverage
set_env =
  ANSIBLE_HOME={[common]ansible_home}
  ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
deps =
  pytest
  mock
  pytest-mock
  pytest-cov
  pytest-ansible
  pytest-xdist
  -ctests/constraints.in
  -rmeta/ee-requirements.txt
  -rtests/unit/requirements.in
  ansible-core>2.21,<2.22
allowlist_externals = rsync, sh
change_dir = {[common]full_collection_path}
commands_pre =
  rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
  {[common]community_aws_install}
commands =
    pytest \
        --cov \
        --cov-report html \
        --cov-report xml \
        --ansible-host-pattern localhost \
        {posargs:tests/unit/}

[testenv:compile-requirements]
description = Regenerate tests/*/requirements.txt lockfiles (latest versions) from their .in sources
labels = compile-requirements
# Pinned for reproducible version resolution across machines/CI. --no-annotate
# (below) is still required even with this pin: the `# via` comments uv would
# otherwise emit are sensitive to interpreter patch/build-level differences
# (observed between two separate Python 3.14 builds) even when every resolved
# package version is identical, which would make check-requirements flaky.
# --no-emit-package ansible-core: pytest-ansible/ansible-compat pull in
# ansible-core transitively; pinning it here would conflict with the
# unit-constraints/generated tox-ansible envs, which each install their own
# ansible-core version.
basepython = python3.14
deps =
  uv
skip_install = true
change_dir = {toxinidir}
commands =
  uv pip compile --universal --no-emit-package ansible-core --no-strip-extras --no-annotate -o tests/unit/requirements.txt tests/unit/requirements.in
  uv pip compile --universal --no-emit-package ansible-core --no-strip-extras --no-annotate -o tests/integration/requirements.txt tests/integration/requirements.in

# CI gate: fails if a tests/*/requirements.txt lockfile was hand-edited (or an
# .in source changed) without recompiling. Runs `uv pip compile` without
# --upgrade so unrelated upstream releases don't trip the gate.
[testenv:check-requirements]
description = Check that tests/*/requirements.txt lockfiles are in sync with their .in sources
labels = check-requirements
# Must match compile-requirements' basepython and flags exactly, or this will
# spuriously fail (see compile-requirements for why --no-annotate is required).
basepython = python3.14
deps =
  uv
allowlist_externals = git
skip_install = true
change_dir = {toxinidir}
commands =
  uv pip compile --universal --no-emit-package ansible-core --no-strip-extras --no-annotate -o tests/unit/requirements.txt tests/unit/requirements.in
  uv pip compile --universal --no-emit-package ansible-core --no-strip-extras --no-annotate -o tests/integration/requirements.txt tests/integration/requirements.in
  git diff --exit-code tests/unit/requirements.txt tests/integration/requirements.txt

[testenv:clean]
description = Remove test results and caches
allowlist_externals = rm, find
deps = coverage
skip_install = true
change_dir = {toxinidir}
commands_pre =
commands =
    coverage erase
    find .tox -name coverage.xml -delete
    find .tox -name .coverage -delete
    rm -rf tests/output/ htmlcov/ coverage-report/ .mypy_cache/ complexity/ .ruff_cache/ .tox/.tox-ansible/

[testenv:diff-cover]
description = Check coverage on new code against origin/main (requires prior unit test run)
labels = coverage
deps =
    diff-cover
allowlist_externals = sh
passenv = DIFF_COMPARE_BRANCH
set_env =
    DIFF_COMPARE_BRANCH={env:DIFF_COMPARE_BRANCH:origin/main}
change_dir = {toxinidir}
commands =
    # Portable newest-coverage discovery (GNU and BSD find; no -printf).
    sh -c 'COVERAGE_FILE=$(python3 -c "import pathlib; paths=sorted(pathlib.Path(\".tox\").rglob(\"coverage.xml\"), key=lambda p: p.stat().st_mtime, reverse=True); print(paths[0] if paths else \"\")"); \
           if [ -z "$COVERAGE_FILE" ] && [ -f coverage.xml ]; then COVERAGE_FILE=coverage.xml; fi; \
           if [ -z "$COVERAGE_FILE" ]; then \
               echo "Error: No coverage.xml found. Run unit tests with coverage first (e.g., tox -e coverage)"; \
               exit 1; \
           fi; \
           echo "Comparing against: $DIFF_COMPARE_BRANCH"; \
           echo "Using coverage file: $COVERAGE_FILE"; \
           diff-cover \
               --compare-branch="$DIFF_COMPARE_BRANCH" \
               --fail-under=80 \
               --format html:diff-coverage.html \
               "$COVERAGE_FILE"'

[testenv:complexity-report]
labels = future-lint
description = Generate a HTML complexity report in the complexity directory
deps =
  flake8 >= 7.4.1
  flake8-pyproject
  flake8-html
change_dir = {toxinidir}
commands_pre =
commands =
    -flake8 \
        --select C90 \
        --max-complexity 10 \
        --format=html \
        --htmldir={posargs:complexity} \
        {posargs:{[common]lint_dirs}}

[testenv:ansible-lint]
description = Run ansible-lint
deps =
  ansible-lint >= 26.6.0
  ansible-core>=2.18,<2.21
  jmespath
change_dir = {toxinidir}
commands_pre =
commands =
  ansible-lint \
        --skip-list=name[missing],yaml[line-length],args[module],run-once[task],ignore-errors,sanity[cannot-ignore],run-once[play] \
        --exclude=.tox/ --exclude=tests/output/ \
        {posargs:{[common]lint_dirs}}

[testenv:pylint-cyclomatic-complexity]
labels = complexity
description = Use pylint to evaluate McCabe cyclomatic complexity (fail if >15, warn if >10)
deps =
  pylint
change_dir = {toxinidir}
commands =
  # Warn if complexity > 10
  -pylint \
    --load-plugins=pylint.extensions.mccabe \
    --disable=all \
    --enable too-complex \
    --max-complexity=10 \
    {posargs:{[common]lint_dirs}}
  # Fail if complexity > 15
  pylint \
    --load-plugins=pylint.extensions.mccabe \
    --disable=all \
    --enable too-complex \
    --max-complexity=15 \
    {posargs:{[common]lint_dirs}}

[testenv:flake8-cognitive-complexity]
labels = complexity
description = Check cognitive complexity using flake8 (fail if >15, warn if >10)
deps =
  flake8 >= 7.4.1
  flake8-pyproject
  flake8-cognitive-complexity
change_dir = {toxinidir}
commands_pre =
commands =
  # Warn if complexity > 10
  -flake8 \
    --select=CCR001 \
    --max-cognitive-complexity=10 \
    {posargs:{[common]lint_dirs}}
  # Fail if complexity > 15
  flake8 \
    --select=CCR001 \
    --max-cognitive-complexity=15 \
    {posargs:{[common]lint_dirs}}


[testenv:pylint-lint]
labels = lint
description = Run pylint tests that are disabled by the default Ansible sanity tests
deps =
  pylint
change_dir = {toxinidir}
commands_pre =
commands =
  pylint \
    --disable R,C,W,E \
    --enable pointless-statement \
    --enable consider-using-dict-items \
    --enable assignment-from-no-return \
    --enable no-else-continue \
    --enable no-else-break \
    --enable simplifiable-if-statement \
    --enable pointless-string-statement \
    --enable redefined-outer-name \
    --enable redefined-builtin \
    --enable unused-import \
    {posargs:{[common]lint_dirs}}

[testenv:ruff]
description = Apply ruff check --fix and ruff format
labels = format
deps =
    ruff==0.16.10
change_dir = {toxinidir}
commands_pre =
commands =
    ruff check --fix {posargs:{[common]lint_dirs}}
    ruff format {posargs:{[common]lint_dirs}}

[testenv:ruff-lint]
description = Lint with ruff check and format --check (no rewrite)
labels = lint
deps =
    ruff==0.16.10
change_dir = {toxinidir}
commands_pre =
commands =
    ruff check {posargs:{[common]lint_dirs}}
    ruff format --check {posargs:{[common]lint_dirs}}

[testenv:ansible-lint-future]
labels = future-lint
description = Run ansible-lint
deps =
  ansible-lint
  jmespath
  git+https://github.com/ansible/ansible.git@devel
  shellcheck-py
commands =
  ansible-lint \
        {posargs:{[common]lint_dirs}}

[testenv:mypy-lint]
allowlist_externals = rsync, ln, sh
labels = future-lint
description = Run mypi type tests
set_env =
  ANSIBLE_HOME={[common]ansible_home}
  ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
  MYPYPATH={[common]ansible_home}
deps =
  mypy
  # ansible-core
  git+https://github.com/ansible/ansible.git@devel
  botocore
  boto3
  placebo
  typing_extensions
commands_pre =
  rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
  {[common]community_aws_install}
  ln -s {env_site_packages_dir}/ansible {[common]ansible_collections_path}/ansible
  ln -s {[common]ansible_home}/collections/ansible_collections {[common]ansible_home}/ansible_collections
commands =
  # TODO: passing directories doesn't work well, it's better to pass the package
  # we might want to consider manipulating posargs/directories into the package names
  mypy \
    --check-untyped-defs \
    --namespace-packages --explicit-package-bases \
    --follow-imports silent \
    -p ansible_collections.amazon.aws.plugins.plugin_utils \
    -p ansible_collections.amazon.aws.plugins.module_utils
