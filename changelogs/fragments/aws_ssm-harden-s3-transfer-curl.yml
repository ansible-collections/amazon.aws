bugfixes:
  - "aws_ssm - harden the S3 file-transfer ``curl`` commands with ``--fail`` and ``--retry`` so a transient S3 5xx is retried, and make the download use ``&& touch`` instead of ``; touch`` so a persistent failure propagates a non-zero exit code instead of writing the S3 error body into the module file, which surfaced as a module deserialization failure (https://github.com/ansible-collections/amazon.aws/issues/3188)."
