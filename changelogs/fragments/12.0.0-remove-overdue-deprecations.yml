breaking_changes:
  - cloudformation - removed the ``template`` parameter. The parameter was deprecated in release 5.0.0 with a removal date of 2026-05-01. Use ``template_body`` with the ``lookup`` plugin instead (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
  - iam_role - removed the ``assume_role_policy_document_raw`` return value. The return value was deprecated in release 5.3.0 with a removal date of 2026-05-01. Use ``assume_role_policy_document`` instead, which has used the same format since release 8.0.0 (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
  - iam_role - removed the ``create_instance_profile`` parameter. The parameter was deprecated in release 5.0.0 with a removal date of 2026-05-01. Use the ``amazon.aws.iam_instance_profile`` module to manage instance profiles (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
  - iam_role - removed the ``delete_instance_profile`` parameter. The parameter was deprecated in release 5.0.0 with a removal date of 2026-05-01. Use the ``amazon.aws.iam_instance_profile`` module to manage instance profiles (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
  - iam_role_info - removed the ``assume_role_policy_document_raw`` return value. The return value was deprecated in release 5.3.0 with a removal date of 2026-05-01. Use ``assume_role_policy_document`` instead, which has used the same format since release 8.0.0 (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
  - iam_role_info - the ``path_prefix`` parameter no longer automatically adds leading and trailing slashes. Paths must now begin and end with ``/``. The automatic correction was deprecated in release 5.0.0 with a removal date of 2026-05-01 (https://github.com/ansible-collections/amazon.aws/pull/XXXX).
