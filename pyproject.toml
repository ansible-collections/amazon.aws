[project]
# This tree is an Ansible collection, not a Python distribution. The [project]
# table exists so that uv can manage a reproducible developer environment; it is
# never built or published to PyPI (see [tool.uv] package = false below).
#
# Dependencies are deliberately NOT consolidated here:
#   - runtime (AWS SDK) deps  -> requirements.txt
#   - unit test deps          -> tests/unit/requirements.txt
#   - integration test deps   -> tests/integration/requirements.txt
#   - developer tooling       -> [dependency-groups] dev, below
name = "amazon-aws"
# uv requires project.version, but this tree is never packaged or published, so
# the value is inert. Deliberately NOT mirrored from galaxy.yml: the collection
# version is bumped every release and a copy here would silently drift.
version = "0.0.0"
description = "Developer toolchain for the amazon.aws Ansible collection"
readme = "README.md"
license = "GPL-3.0-or-later"
# Matches the oldest interpreter in the tox envlist (ansible-core 2.17 / py310).
# Revisit when the supported-Python floor changes.
requires-python = ">=3.10"

[dependency-groups]
# Developer tooling only. Test-specific dependencies stay in
# tests/{unit,integration}/requirements.txt so that ansible-test keeps working
# without uv. tox provisions each environment's own deps from tox.ini, and
# tox-uv-bare makes it do so through uv instead of pip.
dev = [
    "tox>=4.52.1",
    "tox-uv-bare>=1.35.0",
    "prek",
]

[tool.uv]
# Virtual project: uv builds a .venv and installs the dev group into it, but
# never tries to build or install this tree as a package.
package = false

[tool.black]
skip-string-normalization = false
line-length = 120
target-version = ['py38', 'py39']
extend-exclude = '''
/(
  | plugins/module_utils/_version.py
  | \.tox
  | tests/output
)/
'''

[tool.darker]
revision = "origin/main.."

src = [
    "plugins",
    "tests/unit",
    "tests/integration",
]

[tool.isort]
profile = "black"
force_single_line = true
line_length = 120
skip = [".tox", "tests/output"]

src_paths = [
    "plugins",
    "tests/unit",
    "tests/integration",
]

sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "ANSIBLE_CORE", "ANSIBLE_AMAZON_AWS", "ANSIBLE_COMMUNITY_AWS", "LOCALFOLDER"]
known_third_party = ["botocore", "boto3"]
known_ansible_core = ["ansible"]
known_ansible_amazon_aws = ["ansible_collections.amazon.aws"]
known_ansible_community_aws = ["ansible_collections.community.aws"]

[tool.flynt]
transform-joins = true
exclude = [
    "ec2_metadata_facts",
    ".tox",
    "tests/output",
]

[tool.flake8]
# E123, E125 skipped as they are invalid PEP-8.
show-source = true
ignore = ["E123", "E125", "E203", "E402", "E501", "E741", "F401", "F811", "F841", "W503"]
max-line-length = 160
builtins = "_"
exclude = [".tox", "tests/output"]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 120
exclude = [".tox", "tests/output"]

[tool.ruff.lint]
# "F401" - unused-imports - We use these imports to maintain historic Interfaces
# "E402" - import not at top of file - General Ansible style puts the documentation at the top.
unfixable = ["F401"]
ignore = ["F401", "E402"]

[tool.pylint.main]
ignore = [".tox", "tests/output"]

[tool.pytest.ini_options]
xfail_strict = true
markers = [
    "limit_memory: Mark test with memory limit for pytest-memray",
]

[tool.coverage.run]
source = [
    "plugins/",
    "extensions/",
]
relative_files = true

[tool.coverage.report]
exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    "raise NotImplementedError",
    # Handling for botocore not being available is performed by AnsibleAWSModule
    "try:\n(    import botocore\n|    import boto3\n)*except ImportError:\n    pass",
]
include_namespace_packages = true

[tool.coverage.html]
directory = "coverage-report"

[tool.coverage.xml]
output = "coverage.xml"
