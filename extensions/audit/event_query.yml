    .vpcs[] | select(. != null) | {
        name: (.name // .tags.Name // "UNKNOWN"),
        canonical_facts: {
          id: .id,
          status: .state,
          tags: (.tags // {})
        },
        facts: {
          infra_type: "public_cloud",
          infra_bucket: "networking",
          device_type: "vpc"
