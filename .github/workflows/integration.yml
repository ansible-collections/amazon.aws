---
name: integration

# ACA-7242 spike POC (finder branch) - SELECTION-ONLY parity POC.
#   content-plugin-finder (PyPI) -> ImpactReport JSON
#   -> tox-ansible from git main with --impact-file (AAP-94164), NOT PyPI tox-ansible
#   -> report the integration targets selected (does NOT execute the AWS suite).
# Pair with the splitter branch (#3162), which reports the targets ansible_test_splitter
# selects for the identical stimulus. Compare the two sorted target lists for parity.
#
# Round G (cross-collection re-test): earlier rounds ran `content-plugin-finder --impact .`
# from inside the amazon.aws checkout with no --parent, which defaults the discovery scope
# to that one collection. community.aws targets were therefore never discoverable, and the
# resulting "0 community targets" was a property of this harness, not of the finder.
# This round checks out community.aws as well, lays both out under ansible_collections/,
# and passes --parent so cross-collection impact can actually be observed.

on:
  - workflow_call

jobs:
  retrieve-pr-info:
    name: retrieve base ref
    outputs:
      base_ref: ${{ steps.retrieve-pr-info.outputs.base_ref }}
      base_sha: ${{ steps.retrieve-pr-info.outputs.base_sha }}
      head_ref: ${{ steps.retrieve-pr-info.outputs.checkout_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve pull request base ref
        id: retrieve-pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.data.base.ref;
            const baseSha = pr.data.base.sha;
            const checkoutSha = pr.data.head.sha;

            core.setOutput('base_ref', baseBranch);
            core.info(`Successfully set output 'base_ref' to: ${baseBranch}`);
            core.setOutput('base_sha', baseSha);
            core.info(`Successfully set output 'base_sha' to: ${baseSha}`);
            core.setOutput('checkout_sha', checkoutSha);
            core.info(`Successfully set output 'checkout_sha' to: ${checkoutSha}`);

  select-impact-targets:
    needs:
      - retrieve-pr-info
    name: finder + tox-ansible --impact-file (ACA-7242 selection POC)
    permissions:
      pull-requests: read
    env:
      # Round G: both collections are laid out as ansible_collections/<ns>/<name> so
      # content-plugin-finder can discover community.aws targets via --parent.
      collections_root: "./ansible_collections"
      amazon_dir: "./ansible_collections/amazon/aws"
      community_dir: "./ansible_collections/community/aws"
      # Matches the current amazon.aws integration CI pair, for the tox -l listing only.
      tox_env: integration-py3.13-milestone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source collection (on issue comment)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.head_ref }}
          persist-credentials: false
        if: ${{ github.event_name == 'issue_comment' }}

      - name: Checkout the source collection (on other triggering method)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          persist-credentials: false
        if: ${{ github.event_name != 'issue_comment' }}

      # Round G: same community.aws checkout the splitter branch (#3162) uses, so both
      # stacks see the same two collections for the identical stimulus.
      - name: Checkout community.aws collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ansible-collections/community.aws
          path: "${{ env.community_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.base_ref }}
          persist-credentials: false

      - name: Fetch PR base SHA for impact diff
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
        run: git -C "${{ env.amazon_dir }}" fetch --no-tags origin "${BASE_SHA}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install content-plugin-finder and tox-ansible (git main)
        run: |
          set -euo pipefail
          python3 -m pip install -U pip
          # Finder: PyPI is fine for generating ImpactReport JSON.
          # tox-ansible: MUST be git main for --impact-file (AAP-94164), not PyPI.
          python3 -m pip install -U \
            'content-plugin-finder==0.2.0' \
            'tox>=4.52.1' \
            "tox-ansible @ git+https://github.com/ansible/tox-ansible.git@main"
          python3 -c "import importlib.metadata as m; print('content-plugin-finder', m.version('content-plugin-finder')); print('tox-ansible', m.version('tox-ansible'))"

      - name: Generate ImpactReport with content-plugin-finder
        id: impact
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
          HEAD_SHA: ${{ needs.retrieve-pr-info.outputs.head_ref }}
          AMAZON_DIR: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          # Round G: --parent spans BOTH collections so cross-collection targets are
          # discoverable. Previously this ran `--impact .` from inside amazon.aws, which
          # defaults --parent to that collection and made community.aws undiscoverable.
          content-plugin-finder --impact "${{ env.amazon_dir }}" \
            --parent "${{ env.collections_root }}" \
            --depth 6 \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --format json | tee "${{ env.amazon_dir }}/.impact.json"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["AMAZON_DIR"], ".impact.json").read_text())
          targets = report.get("integration_targets") or []

          # Keep collection provenance: the old version collapsed everything to leaf
          # names, which would have hidden community.aws selections even if present.
          amazon = sorted({t.rstrip("/").split("/")[-1] for t in targets if "amazon/aws/" in t})
          community = sorted({t.rstrip("/").split("/")[-1] for t in targets if "community/aws/" in t})
          other = sorted({t for t in targets if "amazon/aws/" not in t and "community/aws/" not in t})

          print(f"[ACA-7242] raw sample: {targets[:3]}")
          print(f"[ACA-7242] finder amazon.aws targets ({len(amazon)}): {amazon}")
          print(f"[ACA-7242] finder community.aws targets ({len(community)}): {community}")
          if other:
              print(f"[ACA-7242] unclassified ({len(other)}): {other[:10]}")

          leaves = sorted(set(amazon) | set(community) | {o.rstrip('/').split('/')[-1] for o in other})

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## ACA-7242 round G: finder selection with --parent across both collections\n\n")
                  fh.write(f"amazon.aws targets: **{len(amazon)}**, community.aws targets: **{len(community)}**\n\n")
                  fh.write("### amazon.aws\n```\n" + "\n".join(amazon) + "\n```\n")
                  fh.write("### community.aws\n```\n" + "\n".join(community) + "\n```\n")
                  if other:
                      fh.write("### unclassified\n```\n" + "\n".join(other) + "\n```\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_integration={'true' if leaves else 'false'}\n")
              fh.write(f"target_count={len(leaves)}\n")
          PY

      - name: Show tox envs scoped by --impact-file (no execution)
        if: steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          echo "::notice::tox-ansible env list with --impact-file (.impact.json)"
          # Round G: capture stderr too. tox-ansible's ImpactReport loader requires every
          # integration_target to start with 'tests/integration/targets/', so cross-collection
          # paths may be warned about and dropped. That is the consumption half of the test.
          set +e
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json -l > tox-impact.log 2>&1
          rc=$?
          set -e
          cat tox-impact.log
          echo "---- tox-ansible exit code: ${rc} ----"
          {
            echo "## ACA-7242 round G: tox-ansible consumption of the ImpactReport"
            echo ""
            echo "\`tox --ansible --impact-file\` exit code: **${rc}**"
            echo ""
            echo '```'
            grep -i "must start with\|integration target\|impact" tox-impact.log | head -20 || echo "(no impact-related messages)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Selection-only POC: not executing '${{ env.tox_env }}' (compare targets vs splitter #3162)."

      - name: Skip notice when finder selected no integration targets
        if: steps.impact.outputs.has_integration != 'true'
        run: |
          echo "::notice::content-plugin-finder selected 0 integration targets."
