---
name: integration

# ACA-7242 spike POC (finder branch) - SELECTION-ONLY parity POC.
#   content-plugin-finder (PyPI) -> ImpactReport JSON
#   -> tox-ansible 26.10.0 (first PyPI release carrying --impact-file, PR #607 / AAP-94164)
#   -> report the integration targets selected (does NOT execute the AWS suite).
#   -> then probe whether the scoped integration env can even start, using
#      ansible-test --list-targets: it runs the layout check and stops, so no AWS
#      calls and no credentials are needed.
# Pair with the splitter branch (#3162), which reports the targets ansible_test_splitter
# selects for the identical stimulus. Compare the two sorted target lists for parity.
# Intentionally does not use ansible_test_splitter or dual-collection community.aws selection.

on:
  - workflow_call

jobs:
  retrieve-pr-info:
    name: retrieve base ref
    outputs:
      base_ref: ${{ steps.retrieve-pr-info.outputs.base_ref }}
      base_sha: ${{ steps.retrieve-pr-info.outputs.base_sha }}
      head_ref: ${{ steps.retrieve-pr-info.outputs.checkout_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve pull request base ref
        id: retrieve-pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.data.base.ref;
            const baseSha = pr.data.base.sha;
            const checkoutSha = pr.data.head.sha;

            core.setOutput('base_ref', baseBranch);
            core.info(`Successfully set output 'base_ref' to: ${baseBranch}`);
            core.setOutput('base_sha', baseSha);
            core.info(`Successfully set output 'base_sha' to: ${baseSha}`);
            core.setOutput('checkout_sha', checkoutSha);
            core.info(`Successfully set output 'checkout_sha' to: ${checkoutSha}`);

  select-impact-targets:
    needs:
      - retrieve-pr-info
    name: finder + tox-ansible --impact-file (ACA-7242 selection POC)
    permissions:
      pull-requests: read
    env:
      amazon_dir: "./amazon_aws"
      # Matches the current amazon.aws integration CI pair, for the tox -l listing only.
      tox_env: integration-py3.13-milestone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source collection (on issue comment)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.head_ref }}
          persist-credentials: false
        if: ${{ github.event_name == 'issue_comment' }}

      - name: Checkout the source collection (on other triggering method)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          persist-credentials: false
        if: ${{ github.event_name != 'issue_comment' }}

      - name: Fetch PR base SHA for impact diff
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
        run: git -C "${{ env.amazon_dir }}" fetch --no-tags origin "${BASE_SHA}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install content-plugin-finder and tox-ansible
        run: |
          set -euo pipefail
          python3 -m pip install -U pip
          # tox-ansible 26.10.0 is the first PyPI release carrying --impact-file
          # (PR #607 / AAP-94164), so the git-main pin is no longer needed.
          python3 -m pip install -U \
            'content-plugin-finder==0.2.0' \
            'tox>=4.52.1' \
            'tox-ansible==26.10.0'
          python3 -c "import importlib.metadata as m; print('content-plugin-finder', m.version('content-plugin-finder')); print('tox-ansible', m.version('tox-ansible'))"

      # Evidence for the DevTools thread: show that the source tree and the built
      # Galaxy artifact both contain tests/integration/targets/, so neither the
      # collection layout nor galaxy.yml build_ignore explains the later failure.
      - name: Evidence - source tree and built artifact both contain the targets
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          echo "---- galaxy.yml build_ignore ----"
          python3 -c "import re,sys; s=open('galaxy.yml').read(); m=re.search(r'build_ignore:.*?(?=\n[a-z_]+:|\Z)',s,re.S); print(m.group(0).strip() if m else 'NO build_ignore key')"
          src_targets=$(ls -1 tests/integration/targets | wc -l | tr -d ' ')
          echo "---- source tree: ${src_targets} target dirs ----"

          python3 -m pip install -q 'ansible-core' >/dev/null 2>&1 || true
          ansible-galaxy collection build . --output-path /tmp/colbuild --force
          TAR=$(ls /tmp/colbuild/*.tar.gz | head -1)
          entries=$(tar tzf "$TAR" | grep -c '^tests/integration/targets/' || true)
          dirs=$(tar tzf "$TAR" | sed -n 's|^tests/integration/targets/\([^/]*\)/.*|\1|p' | sort -u | wc -l | tr -d ' ')
          cfn=$(tar tzf "$TAR" | grep -c '^tests/integration/targets/cloudformation/' || true)
          echo "---- built artifact: $(basename "$TAR") ----"
          echo "  paths under tests/integration/targets/ : ${entries}"
          echo "  distinct target dirs                   : ${dirs}"
          echo "  cloudformation target paths            : ${cfn}"
          {
            echo "## Evidence: source and built artifact"
            echo ""
            echo "| | target dirs |"
            echo "| :---- | :---- |"
            echo "| source tree | ${src_targets} |"
            echo "| built Galaxy artifact | ${dirs} (${entries} paths, cloudformation present: ${cfn} paths) |"
            echo ""
            echo "ansible-galaxy: \`$(ansible-galaxy --version 2>/dev/null | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate ImpactReport with content-plugin-finder
        id: impact
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
          HEAD_SHA: ${{ needs.retrieve-pr-info.outputs.head_ref }}
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          # Relative path required by tox-ansible impact loader (absolute paths rejected).
          content-plugin-finder --impact . \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --format json | tee .impact.json
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".impact.json").read_text())
          targets = report.get("integration_targets") or []
          # Normalize to sorted leaf target names so this list can be diffed against
          # the splitter branch (#3162) output directly.
          leaves = sorted({t.rstrip("/").split("/")[-1] for t in targets})
          print(f"[ACA-7242] finder integration_targets ({len(leaves)}): {leaves}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## ACA-7242 finder selection (content-plugin-finder)\n\n")
                  fh.write(f"Selected integration targets: **{len(leaves)}**\n\n")
                  fh.write("```\n" + "\n".join(leaves) + "\n```\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_integration={'true' if leaves else 'false'}\n")
              fh.write(f"target_count={len(leaves)}\n")
          PY

      - name: Show tox envs scoped by --impact-file (no execution)
        if: steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          echo "::notice::tox-ansible env list with --impact-file (.impact.json)"
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json -l

      # Does the scoped integration env actually start, or does ansible-test abort
      # because the installed collection copy has no tests/integration/targets/?
      # --list-targets performs ansible-test's layout check and then stops, so this
      # exercises the full ADE install path with no AWS calls and no credentials.
      - name: Probe scoped integration execution (--list-targets, no AWS)
        if: steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          # tox-ansible reads [tool.tox-ansible] from pyproject.toml and, when that
          # table exists, ignores the [ansible] section of --conf entirely. main sets
          # skip = ["integration-"], which strips every integration env and makes
          # `-e integration-*` unresolvable (tox exits 254). Neutralise it in this
          # ephemeral CI checkout only; the committed file is untouched.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pyproject.toml")
          s = p.read_text()
          old = 'skip = ["integration-"]'
          assert old in s, "expected skip entry not found in pyproject.toml"
          p.write_text(s.replace(old, "skip = []", 1))
          print("neutralised skip = [\"integration-\"] for this run")
          PY
          echo "---- integration envs now generated ----"
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json -l | grep '^integration-' | head -5 || echo "(none)"
          set +e
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json \
            -e "${{ env.tox_env }}" -- --list-targets > probe.log 2>&1
          rc=$?
          set -e
          tail -40 probe.log
          echo "---- tox exit code: ${rc} ----"
          if grep -q "Cannot run integration tests without" probe.log; then
            verdict="REPRODUCED: ansible-test aborted, installed collection has no tests/integration/targets/"
          elif [ "$rc" -eq 0 ]; then
            verdict="NOT REPRODUCED: ansible-test found the targets dir and listed targets"
          else
            verdict="INCONCLUSIVE: exit ${rc} for some other reason, see log"
          fi
          echo "::notice::${verdict}"
          {
            echo "## Install-layout probe (tox-ansible 26.10.0, ansible-test --list-targets)"
            echo ""
            echo "tox exit code: **${rc}**"
            echo ""
            echo "**${verdict}**"
            echo ""
            echo '```'
            grep -iE "FATAL|Cannot run integration|list-targets|ERROR" probe.log | head -15 || echo "(no matching lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The decisive diagnostic: what did ADE actually lay down at the path
      # tox-ansible cd's into? Runs even though the probe failed, because the
      # probe captures its own exit code rather than aborting the job.
      - name: Evidence - contents of the installed collection ADE produced
        if: always() && steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          COL=".tox/${{ env.tox_env }}/lib/python3.13/site-packages/ansible_collections/amazon/aws"
          echo "---- installed collection: ${COL} ----"
          if [ ! -d "$COL" ]; then
            echo "installed collection directory does not exist"; exit 0
          fi
          echo "---- top level ----"
          ls -la "$COL" | head -30
          echo "---- is it a symlink? ----"
          ls -ld "$COL"
          for d in tests tests/integration tests/integration/targets; do
            if [ -e "$COL/$d" ]; then
              echo "PRESENT: $d ($(ls -1 "$COL/$d" 2>/dev/null | wc -l | tr -d ' ') entries)"
            else
              echo "MISSING: $d"
            fi
          done
          {
            echo "## Evidence: installed collection produced by ade install -e"
            echo ""
            echo "Path tox-ansible runs ansible-test from:"
            echo '```'
            echo "$COL"
            echo '```'
            echo '```'
            ls -1 "$COL" 2>/dev/null | head -25
            echo '```'
            for d in tests tests/integration tests/integration/targets; do
              if [ -e "$COL/$d" ]; then
                echo "- \`$d\` present ($(ls -1 "$COL/$d" 2>/dev/null | wc -l | tr -d ' ') entries)"
              else
                echo "- \`$d\` **MISSING**"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice when finder selected no integration targets
        if: steps.impact.outputs.has_integration != 'true'
        run: |
          echo "::notice::content-plugin-finder selected 0 integration targets."
