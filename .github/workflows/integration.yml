---
name: integration

# ACA-7242 spike POC (finder branch):
#   content-plugin-finder (PyPI) → ImpactReport JSON
#   → tox-ansible from git main with --impact-file (AAP-94164), NOT PyPI tox-ansible
#   → scoped ansible-test integration for selected targets
# Intentionally does not use ansible_test_splitter or dual-collection community.aws selection.

on:
  - workflow_call

jobs:
  retrieve-pr-info:
    name: retrieve base ref
    outputs:
      base_ref: ${{ steps.retrieve-pr-info.outputs.base_ref }}
      base_sha: ${{ steps.retrieve-pr-info.outputs.base_sha }}
      head_ref: ${{ steps.retrieve-pr-info.outputs.checkout_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve pull request base ref
        id: retrieve-pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.data.base.ref;
            const baseSha = pr.data.base.sha;
            const checkoutSha = pr.data.head.sha;

            core.setOutput('base_ref', baseBranch);
            core.info(`Successfully set output 'base_ref' to: ${baseBranch}`);
            core.setOutput('base_sha', baseSha);
            core.info(`Successfully set output 'base_sha' to: ${baseSha}`);
            core.setOutput('checkout_sha', checkoutSha);
            core.info(`Successfully set output 'checkout_sha' to: ${checkoutSha}`);

  run-impact-tests:
    needs:
      - retrieve-pr-info
    name: finder + tox-ansible --impact-file (ACA-7242 POC)
    permissions:
      pull-requests: read
    env:
      amazon_dir: "./amazon_aws"
      # Match current amazon.aws integration CI pair (see previous workflow env).
      tox_env: integration-py3.13-milestone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source collection (on issue comment)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.head_ref }}
          persist-credentials: false
        if: ${{ github.event_name == 'issue_comment' }}

      - name: Checkout the source collection (on other triggering method)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          persist-credentials: false
        if: ${{ github.event_name != 'issue_comment' }}

      - name: Fetch PR base SHA for impact diff
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
        run: git -C "${{ env.amazon_dir }}" fetch --no-tags origin "${BASE_SHA}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install content-plugin-finder and tox-ansible (git main)
        run: |
          set -euo pipefail
          python3 -m pip install -U pip
          # Finder: PyPI is fine for generating ImpactReport JSON.
          # tox-ansible: MUST be git main for --impact-file (AAP-94164), not PyPI.
          python3 -m pip install -U \
            'content-plugin-finder==0.2.0' \
            'tox>=4.52.1' \
            "tox-ansible @ git+https://github.com/ansible/tox-ansible.git@main"
          python3 -c "import importlib.metadata as m; print('content-plugin-finder', m.version('content-plugin-finder')); print('tox-ansible', m.version('tox-ansible')); print('tox-ansible location', m.distribution('tox-ansible').locate_file(''))"

      - name: Generate ImpactReport with content-plugin-finder
        id: impact
        env:
          BASE_SHA: ${{ needs.retrieve-pr-info.outputs.base_sha }}
          HEAD_SHA: ${{ needs.retrieve-pr-info.outputs.head_ref }}
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          # Relative path required by tox-ansible impact loader (absolute paths rejected).
          content-plugin-finder --impact . \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --format json | tee .impact.json
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".impact.json").read_text())
          targets = report.get("integration_targets") or []
          print(f"[ACA-7242] integration_targets ({len(targets)}): {targets}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_integration={'true' if targets else 'false'}\n")
              fh.write(f"target_count={len(targets)}\n")
          PY

      - name: Show tox envs under --impact-file
        if: steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          echo "::notice::tox-ansible env list with --impact-file (.impact.json)"
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json -l
          echo "::notice::Will run: tox --ansible --conf tox-ansible.ini --impact-file .impact.json -e ${{ env.tox_env }}"

      - name: Skip notice when finder selected no integration targets
        if: steps.impact.outputs.has_integration != 'true'
        run: |
          echo "::notice::content-plugin-finder selected 0 integration targets; skipping tox integration run."

      - uses: ansible/ansible-test-auth@008750a5bf07124c3ab86d30d73d7319d7518f36
        if: steps.impact.outputs.has_integration == 'true'

      - name: Run scoped integration via tox-ansible --impact-file
        if: steps.impact.outputs.has_integration == 'true'
        working-directory: ${{ env.amazon_dir }}
        run: |
          set -euo pipefail
          tox --ansible --conf tox-ansible.ini --impact-file .impact.json -e "${{ env.tox_env }}"
