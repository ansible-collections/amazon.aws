---
name: integration

# ACA-7242 spike POC (splitter branch) - SELECTION-ONLY parity baseline.
#   Runs the existing ansible_test_splitter across amazon.aws + community.aws and
#   reports which integration targets it selects for the stimulus, WITHOUT running
#   the AWS integration suite. Pair with the finder branch (#3163), which reports
#   the content-plugin-finder + tox-ansible selection for the identical stimulus.
#   Compare the two sorted target lists for parity.

on:
  - workflow_call

jobs:
  retrieve-pr-info:
    name: retrieve base ref
    outputs:
      base_ref: ${{ steps.retrieve-pr-info.outputs.base_ref }}
      head_ref: ${{ steps.retrieve-pr-info.outputs.checkout_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve pull request base ref
        id: retrieve-pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number, // The issue number from the trigger
            });

            const baseBranch = pr.data.base.ref;
            // The specific commit hash of the PR
            const checkoutSha = pr.data.head.sha;

            // This sets the output for other jobs
            core.setOutput('base_ref', baseBranch);
            core.info(`Successfully set output 'base_ref' to: ${baseBranch}`);
            core.setOutput('checkout_sha', checkoutSha);
            core.info(`Successfully set output 'checkout_sha' to: ${checkoutSha}`);

  splitter:
    needs:
      - retrieve-pr-info
    name: ansible test splitter (selection only)
    permissions:
      pull-requests: read
    env:
      amazon_dir: "./amazon_aws"
      community_dir: "./community_aws"
    outputs:
      jobs: ${{ steps.compute.outputs.jobs }}
      targets: ${{ steps.compute.outputs.targets }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source collection (on issue comment)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.head_ref }}
          persist-credentials: false
        if: ${{ github.event_name == 'issue_comment' }}

      - name: Checkout the source collection (on other triggering method)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ env.amazon_dir }}"
          fetch-depth: 0
          persist-credentials: false
        if: ${{ github.event_name != 'issue_comment' }}

      - name: Checkout community.aws collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ansible-collections/community.aws
          path: "${{ env.community_dir }}"
          fetch-depth: 0
          ref: ${{ needs.retrieve-pr-info.outputs.base_ref }}
          persist-credentials: false

      - name: list changes for pull request
        id: compute
        uses: ansible/cloud-content-ci-automation/.github/actions/ansible_test_splitter@6659b608aab58bf1d20641b805eb9cb4fd2b771f
        with:
          collections_to_test: "${{ env.amazon_dir}}, ${{ env.community_dir }}"
          total_jobs: 24
          base_ref: '${{ needs.retrieve-pr-info.outputs.base_ref }}'

      - name: Report selected targets (parity artifact)
        env:
          SPLITTER_JOBS: ${{ steps.compute.outputs.jobs }}
          SPLITTER_TARGETS: ${{ steps.compute.outputs.targets }}
        run: |
          set -euo pipefail
          echo "::notice::splitter jobs: ${SPLITTER_JOBS}"
          python3 <<'PY'
          import json
          import os

          raw = (os.environ.get("SPLITTER_TARGETS") or "").strip() or "{}"
          try:
              mapping = json.loads(raw)
          except json.JSONDecodeError:
              mapping = {}

          amazon, community = set(), set()
          for job, target_str in mapping.items():
              for target in (target_str or "").split():
                  leaf = target.rstrip("/").split("/")[-1]
                  (community if "community.aws" in job else amazon).add(leaf)

          a = sorted(amazon)
          c = sorted(community)
          print(f"[ACA-7242] splitter amazon.aws targets ({len(a)}): {a}")
          print(f"[ACA-7242] splitter community.aws targets ({len(c)}): {c}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## ACA-7242 splitter selection (ansible_test_splitter)\n\n")
                  fh.write(f"amazon.aws targets: **{len(a)}**, community.aws targets: **{len(c)}**\n\n")
                  fh.write("### amazon.aws\n```\n" + "\n".join(a) + "\n```\n")
                  fh.write("### community.aws\n```\n" + "\n".join(c) + "\n```\n")
          PY
