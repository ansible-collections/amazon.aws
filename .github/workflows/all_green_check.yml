---
name: all_green

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - stable-*
  push:
    branches:
      - main
      - stable-*

jobs:
  linters:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/linters.yml
  ansible-lint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ansible-lint.yml
  ansible-test:
    uses: ./.github/workflows/ansible-test.yml
  coverage:
    uses: ./.github/workflows/coverage.yml

  all_green:
    if: ${{ always() }}
    needs:
      - linters
      - ansible-lint
      - ansible-test
      - coverage
    runs-on: ubuntu-latest
    steps:
      - run: |
          python -c "
          required = ['ansible-test', 'coverage']
          if '${{ github.event_name }}' == 'pull_request':
            required = ['linters', 'ansible-lint', 'ansible-test', 'coverage']
          results = {'linters': '${{ needs.linters.result }}', 'ansible-lint': '${{ needs.ansible-lint.result }}',
                     'ansible-test': '${{ needs.ansible-test.result }}', 'coverage': '${{ needs.coverage.result }}'}
          ok = all(results[j] == 'success' for j in required)
          skipped_ok = all(results[j] in ('success', 'skipped') for j in results)
          assert ok and skipped_ok, f'required={required} results={results}'
          "
