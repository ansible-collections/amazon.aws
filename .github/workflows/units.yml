# Ansible unit testing with ansible-test-gh-action

---
name: units

on:
  workflow_call:
    inputs:
      ansible-core-versions:
        description: 'JSON array of ansible-core versions to test'
        required: false
        type: string
        default: '["milestone", "devel"]'
      python-versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.14"]'
      matrix-exclude:
        description: 'JSON array of matrix exclusions'
        required: false
        type: string
        default: '[]'
      canonical-ansible-version:
        description: 'Canonical ansible-core version for coverage'
        required: false
        type: string
        default: 'milestone'
      canonical-python-version:
        description: 'Canonical Python version for coverage'
        required: false
        type: string
        default: '3.14'

jobs:
  units:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core-version: ${{ fromJson(inputs.ansible-core-versions) }}
        python-version: ${{ fromJson(inputs.python-versions) }}
        exclude: ${{ fromJson(inputs.matrix-exclude) }}
    steps:
      - name: Perform unit testing
        id: ansible-test
        uses: tremble/ansible-test-gh-action@946052847ee83635f3f392719d1b153fc715acd5
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: units
          target-python-version: ${{ matrix.python-version }}
          coverage: auto
          pull-request-change-detection: true
          debug: true
          # test-deps not needed: ansible-test runs the tests in a container and automatically picks up tests/unit/requirements.txt
          # test-deps: -r tests/unit/requirements.txt

      - name: Upload coverage XML files
        if: always() && steps.ansible-test.outputs.coverage-report-files != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-units-${{ matrix.ansible-core-version }}-py${{ matrix.python-version }}
          path: ${{ steps.ansible-test.outputs.coverage-report-files }}
          if-no-files-found: ignore

      - name: Upload canonical coverage
        if: |
          always() &&
          steps.ansible-test.outputs.coverage-report-files != '' &&
          matrix.ansible-core-version == inputs.canonical-ansible-version &&
          matrix.python-version == inputs.canonical-python-version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-units-canonical
          path: ${{ steps.ansible-test.outputs.coverage-report-files }}
          if-no-files-found: ignore
