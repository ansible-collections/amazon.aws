---
name: linters

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions:
  contents: read

jobs:
  linters:
    name: Run lint environments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Run Ruff
        run: |
          uvx ruff==0.16.10 check plugins tests extensions
          uvx ruff==0.16.10 format --check plugins tests extensions

      - name: Run Pylint
        run: |
          uvx pylint==4.1.3 \
            --disable R,C,W,E \
            --enable pointless-statement \
            --enable consider-using-dict-items \
            --enable assignment-from-no-return \
            --enable no-else-continue \
            --enable no-else-break \
            --enable simplifiable-if-statement \
            --enable pointless-string-statement \
            --enable redefined-outer-name \
            --enable redefined-builtin \
            --enable unused-import \
            plugins tests extensions

      - name: Run ansible-lint
        run: uvx --from 'ansible-lint>=26.6.0' ansible-lint plugins tests extensions
