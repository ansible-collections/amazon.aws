---
name: linters

on: [workflow_call] # allow this workflow to be called from other workflows

permissions:
  contents: read

jobs:
  linters:
    name: Run lint environments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run ruff and pylint via uv on Python 3.11. The ruff version is the
      # single source of truth pinned in pyproject.toml [dependency-groups].ruff;
      # keep the uvx pin below in sync with it.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Run Ruff
        run: |
          uvx ruff==0.16.10 check plugins tests extensions
          uvx ruff==0.16.10 format --check plugins tests extensions

      - name: Run Pylint
        run: |
          uvx pylint==4.1.3 \
            --disable R,C,W,E \
            --enable pointless-statement \
            --enable consider-using-dict-items \
            --enable assignment-from-no-return \
            --enable no-else-continue \
            --enable no-else-break \
            --enable simplifiable-if-statement \
            --enable pointless-string-statement \
            --enable redefined-outer-name \
            --enable redefined-builtin \
            --enable unused-import \
            plugins tests extensions
