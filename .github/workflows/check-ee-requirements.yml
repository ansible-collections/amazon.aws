---
# Keep the SDK floor version in sync across every place it's declared:
# tests/test-constraints.in, meta/ee-requirements.txt, plugins/module_utils/botocore.py,
# tests/unit/.../test_minimal_versions.py, tests/integration/constraints.txt, and
# tests/unit/constraints.txt.
# Catches a bump to one file without the others, same shape as
# check-unit-requirements.yml.
#
# tests/integration/constraints.txt and tests/unit/constraints.txt duplicate
# (rather than point at) tests/test-constraints.in because ansible-test stages
# only the contents of tests/integration/ or tests/unit/ before running its
# own hardcoded pip install there, so a -c reference to a file outside that
# directory can't be resolved.
#
# NOTE: this is a local fallback. A generalized version of this check is proposed
# as a reusable composite action in ansible/cloud-content-ci-automation (alongside
# ansible_test_splitter/ansible_read_targets) so other collections doing the same
# Unified Testing Strategy dependency migration can reuse it. If/when that lands,
# this workflow should be replaced with a call to the shared action.
name: check-ee-requirements

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - tests/test-constraints.in
      - meta/ee-requirements.txt
      - plugins/module_utils/botocore.py
      - tests/unit/plugins/module_utils/modules/ansible_aws_module/test_minimal_versions.py
      - tests/integration/constraints.txt
      - tests/unit/constraints.txt
  push:
    branches:
      - main
      - stable-*
    paths:
      - tests/test-constraints.in
      - meta/ee-requirements.txt
      - plugins/module_utils/botocore.py
      - tests/unit/plugins/module_utils/modules/ansible_aws_module/test_minimal_versions.py
      - tests/integration/constraints.txt
      - tests/unit/constraints.txt

jobs:
  floor-versions-in-sync:
    name: SDK floor versions match across dependency files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert botocore/boto3/aiobotocore floors are in sync
        run: python3 .github/scripts/check_sdk_floor_versions.py
