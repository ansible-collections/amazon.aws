---
name: update collection variables

concurrency:
  group: ${{ github.workflow }} @ ${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - stable-*
  pull_request_target:
jobs:
  update-variables:
    uses: ansible-network/github_actions/.github/workflows/update_aws_variables.yml@4678c74a7d712d55e663c88f66eec6d9c3642550 # @main as of 2026-10-05
