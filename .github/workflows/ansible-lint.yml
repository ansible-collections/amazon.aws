---
name: ansible-lint

on: [workflow_call] # allow this workflow to be called from other workflows

permissions:
  contents: read

jobs:
  ansible-lint:
    # Run the "ansible-lint" tox env so the lint configuration (deps, skip-list,
    # excludes) lives in tox.ini and stays consistent between local and CI runs.
    # The env pins ansible-core>=2.18, which requires Python >=3.11, so set up
    # 3.11 explicitly rather than relying on a runner default (the shared
    # tox.yml reusable workflow is locked to Python 3.10).
    name: Run Tox based code tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install tox
        run: python -m pip install tox

      - name: Run ansible-lint tox env
        run: tox -e ansible-lint
