---
name: tox-ansible

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - stable-*
  push:
    branches:
      - main
      - stable-*

permissions:
  contents: read

jobs:
  generate-matrix:
    name: Generate tox-ansible matrix
    runs-on: ubuntu-latest
    outputs:
      envlist: ${{ steps.matrix.outputs.envlist }}
      sanity_targets: ${{ steps.matrix.outputs.sanity_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Create tool environment
        run: uv venv --python 3.12

      - name: Install test orchestration tools
        run: uv pip install tox-ansible==26.9.0 tox-uv-bare==1.36.0

      - name: Generate matrix
        id: matrix
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.sha }}
        run: |
          github_output="$GITHUB_OUTPUT"
          export GITHUB_OUTPUT="$RUNNER_TEMP/tox-ansible-output"
          : > "$GITHUB_OUTPUT"
          uv run --no-project tox --ansible --gh-matrix
          python3 - "$GITHUB_OUTPUT" "$github_output" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          output_path = Path(sys.argv[1])
          github_output_path = Path(sys.argv[2])
          contents = output_path.read_text(encoding="utf-8")
          prefix = "envlist="
          if not contents.startswith(prefix):
              raise SystemExit("tox-ansible did not write an envlist output")
          envlist = json.loads(contents[len(prefix) :].strip())
          envlist = [
              entry
              for entry in envlist
              if entry["name"].startswith(("unit-", "sanity-"))
          ]

          companions = [
              ("unit-constraints", "3.11"),
              ("sanity-py3.11-2.18", "3.11"),
              ("unit-py3.15-devel", "3.15"),
              ("sanity-py3.15-devel", "3.15"),
              ("unit-py3.15-milestone", "3.15"),
              ("sanity-py3.15-milestone", "3.15"),
              ("coverage", "3.14"),
          ]
          existing = {entry["name"] for entry in envlist}
          for name, python_version in companions:
              if name not in existing:
                  envlist.append(
                      {
                          "description": f"Run {name}",
                          "factors": name.split("-"),
                          "name": name,
                          "python": python_version,
                      }
                  )

          base_sha = os.environ.get("DIFF_BASE_SHA", "")
          head_sha = os.environ.get("DIFF_HEAD_SHA", "")
          if base_sha and base_sha != "0" * len(base_sha) and head_sha:
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=ACMR", "-z", base_sha, head_sha],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              changed_paths = changed.decode("utf-8", errors="surrogateescape").split("\0")
          else:
              changed_paths = subprocess.check_output(["git", "ls-files", "-z"]).decode(
                  "utf-8", errors="surrogateescape"
              ).split("\0")

          collection_dirs = ("plugins/", "tests/", "extensions/", "docs/", "changelogs/", "meta/")
          collection_files = {
              "README.md",
              "CHANGELOG.rst",
              "galaxy.yml",
              "requirements.txt",
              "test-requirements.txt",
              "bindep.txt",
              "COPYING",
          }
          sanity_targets = sorted(
              path
              for path in changed_paths
              if path and (path.startswith(collection_dirs) or path in collection_files)
          )

          github_output_path.write_text(
              f"envlist={json.dumps(envlist, separators=(',', ':'))}\n",
              encoding="utf-8",
          )
          with github_output_path.open("a", encoding="utf-8") as output:
              output.write(f"sanity_targets={json.dumps(sanity_targets, separators=(',', ':'))}\n")
          PY

  tox-ansible:
    name: Run ${{ matrix.entry.name }}
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.generate-matrix.outputs.envlist) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Create tool environment
        run: uv venv --python 3.12

      - name: Install test orchestration tools
        run: uv pip install tox-ansible==26.9.0 tox-uv-bare==1.36.0

      - name: Run tox environment
        env:
          TOX_ENV: ${{ matrix.entry.name }}
          SANITY_TARGETS: ${{ needs.generate-matrix.outputs.sanity_targets }}
        run: |
          if [[ "$TOX_ENV" == "unit-constraints" || "$TOX_ENV" == "coverage" ]]; then
            uv run --no-project tox -e "$TOX_ENV"
          elif [[ "$TOX_ENV" == sanity-* ]]; then
            mapfile -d '' -t sanity_targets < <(
              python3 -c 'import json, sys; sys.stdout.buffer.write(b"\0".join(path.encode() for path in json.loads(sys.argv[1])))' "$SANITY_TARGETS"
            )
            if (( ${#sanity_targets[@]} == 0 )); then
              echo "No changed collection files require sanity checks"
            else
              uv run --no-project tox --ansible -e "$TOX_ENV" -- "${sanity_targets[@]}"
            fi
          else
            uv run --no-project tox --ansible -e "$TOX_ENV"
          fi

      - name: Locate full coverage report
        if: matrix.entry.name == 'coverage'
        run: |
          set -euo pipefail
          coverage_file=$(find .tox -name coverage.xml -type f -print -quit)
          if [[ -z "$coverage_file" ]]; then
            echo "::error::coverage.xml not found under .tox"
            exit 1
          fi
          coverage_file=$(realpath "$coverage_file")
          case "$coverage_file" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "::error::coverage.xml path outside workspace"; exit 1 ;;
          esac
          echo "COVERAGE_FILE=$coverage_file" >> "$GITHUB_ENV"
          echo "Found full coverage report at $coverage_file"

      - name: Upload coverage artifact
        if: matrix.entry.name == 'coverage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ env.COVERAGE_FILE }}

  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run ruff
        run: |
          uvx ruff==0.16.10 check plugins tests extensions
          uvx ruff==0.16.10 format --check plugins tests extensions

      - name: Run ansible-lint
        run: uvx --from 'ansible-lint>=26.6.0' ansible-lint --skip-list 'name[missing],yaml[line-length],args[module],run-once[task],ignore-errors,sanity[cannot-ignore],run-once[play]' --exclude=.tox/ --exclude=tests/output/ plugins tests extensions
