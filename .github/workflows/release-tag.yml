---
name: Generate GitHub Release
concurrency:
  group: release-${{ github.head_ref }}
  cancel-in-progress: true
on:
  push:
    tags:
      - "*"

jobs:
  generate-release-log:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Log
        uses: $/.github/actions/ansible_release_log@b0d828478edee81ca004521bb71d49fbf9d8b455 # main as of 2026-10-05
        with:
          release: ${{ github.ref_name }}

  perform-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - generate-release-log
    steps:
      - name: Generate Release
        uses: $/.github/actions/ansible_release_tag@b0d828478edee81ca004521bb71d49fbf9d8b455 # main as of 2026-10-05
        with:
          release: ${{ github.ref_name }}
          collection-name: amazon.aws
