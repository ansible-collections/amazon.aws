---
name: coverage

on: [workflow_call] # allow this workflow to be called from other workflows

jobs:
  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14" # tox-uv defaults to the system interpreter otherwise

      - name: Install developer toolchain
        run: uv sync --dev --locked # fails if uv.lock drifts from pyproject.toml

      - name: Run unit tests with coverage (tox)
        # Dedicated env covers plugins/ AND extensions/ (tox-ansible unit coverage
        # is scoped to plugins/ only). See [testenv:coverage] in tox.ini.
        run: uv run tox -e coverage

      - name: Locate coverage.xml artifact
        run: |
          COVERAGE_FILE=$(find .tox -name coverage.xml -type f 2>/dev/null | head -1)
          if [[ -z "$COVERAGE_FILE" ]] && [[ -f coverage.xml ]]; then
            COVERAGE_FILE=coverage.xml
          fi
          if [[ -z "$COVERAGE_FILE" ]]; then
            echo "::error::coverage.xml not found under .tox"
            exit 1
          fi
          COVERAGE_FILE=$(realpath "$COVERAGE_FILE")
          case "$COVERAGE_FILE" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "::error::coverage.xml path outside workspace"; exit 1 ;;
          esac
          echo "COVERAGE_FILE=$COVERAGE_FILE" >> $GITHUB_ENV
          echo "Found coverage at $COVERAGE_FILE"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ env.COVERAGE_FILE }}
